# The seed ingredient registry (plan 03, Q5). `vault init` writes one
# ingredients/<slug>.md per entry; `vault ingredients seed` adds the missing
# ones to an existing vault without touching an entry already there.
#
# Data, not code (plan 03, decision 1): the regional names are here as aliases,
# with the owner's defaults (Québec names, metric packages). Written by hand from
# general cooking knowledge, independently of tests/fixtures/corpus, so the
# corpus metrics measure it honestly (R3).
#
# Shape: slug → the frontmatter of the ingredient file (docs/INGREDIENTS.md),
# plus `notes`, the prose body. Densities are grams per millilitre, weights grams
# for one unit. Aliases are exact synonyms only: a generic word goes under an
# entry only when a card using it can mean nothing else. Plurals come from the
# rules in vocab/normalize.yaml; irregular ones are listed.
#
# Both languages: the French and Québec names, the English names of an
# anglophone neighbour's card, older or regional synonyms (sucre brun, gruau,
# safran des Indes, beurre de peanut), and the brand names Québec cards use as
# the product's name (Crisco, Philadelphia, lait Carnation, Eagle Brand). Not
# misspellings: those are for the resolve queue.
#
# Not aliases: a bare name whose product depends on the unit or the prep
# (tomates: fresh or canned; champignons: fresh or canned), and a word that means
# another product in the other language (English "lard" is saindoux, French
# "lard" is salt pork; Québec English "shallots" are often green onions). The
# first R3 measurement found these four as a merge or an auto-resolved ambiguous
# form; they were removed. Where the line says which product for certain, a
# disambiguation rule (`when:`, docs/INGREDIENTS.md) settles the bare name:
# tomates and champignons by the can or by weight or count, bœuf and porc with
# prep haché or en cubes, lard by the recipe's language, soupe à l'oignon by the
# packet. What stays uncertain (tomates by the cup, huile, bouillon, fromage,
# échalotes) goes through the resolve queue.

